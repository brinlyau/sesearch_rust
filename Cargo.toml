[package]
name = "sesearch_rust"
version = "0.1.0"
edition = "2021"
description = "A sesearch-style query tool for SELinux binary kernel policies (Android sepolicy / precompiled_sepolicy)"
license = "MIT"
repository = "https://github.com/brinlyau/sesearchmac"

[lib]
name = "sesearch_rust"
path = "src/lib.rs"

[[bin]]
name = "sesearch_rust"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
